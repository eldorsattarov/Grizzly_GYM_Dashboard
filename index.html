<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Grizzly GYM — Boshqaruv tizimi</title>
    <meta name="description" content="Fitnes zali uchun a'zolik, to'lov va sotuv boshqaruvi" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grizzly GYM" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!--
      Server boshqa manzilda bo'lsa shu qatorni yoqing.
      Server tayyor frontendni o'zi bersa — kerak emas.
    -->
    <script>
      // window.__GRIZZLY_API__ = 'https://admin.grizzlygym.uz/api';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Servis-vorker: dasturni o'rnatiladigan qiladi. Faqat HTTPS da ishlaydi. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // Ro'yxatdan o'tmasa dastur baribir ishlaydi — shunchaki o'rnatilmaydi
          });
        });
      }
    </script>
  </body>
</html>
